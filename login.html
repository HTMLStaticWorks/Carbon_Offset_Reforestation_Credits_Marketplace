<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | GreenScape Living</title>
  <meta name="description" content="Sign in to your GreenScape Living client portal to access IoT telemetry and carbon credits.">
  
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="alternate icon" href="favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body style="min-height: 100vh; background-color: var(--clr-bg);">
  
  <!-- Floating Theme & RTL Controls (Out of the box - Top Right Corner) -->
  <div class="auth-page-actions">
    <button class="btn-icon btn-theme-toggle" aria-label="Toggle Dark Mode">
      <i class="ph ph-moon"></i>
    </button>
    <button class="btn-icon btn-rtl-toggle" aria-label="Toggle RTL">
      <i class="ph ph-arrows-left-right"></i>
    </button>
  </div>

  <div class="auth-split-wrapper">
    <!-- Right Panel: Sign-In Form & Security Assurance Section -->
    <div class="auth-form-panel">
      <div class="auth-card fade-up" style="max-width: 440px; width: 100%;">
        <!-- Centered Brand with Increased Font Size -->
        <div style="text-align: center; margin-bottom: var(--space-5);">
          <a href="index.html" class="nav-logo" style="font-size: 2rem; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: var(--clr-text-main); text-decoration: none; gap: 0.5rem; letter-spacing: -0.02em;">
            <i class="ph-fill ph-leaf" style="color: var(--clr-primary); font-size: 2.25rem;"></i> GreenScape
          </a>
        </div>

        

        <h2 style="font-size: 2rem; margin-bottom: 0.25rem;">Welcome Back</h2>
        <p style="margin-bottom: var(--space-6);">Sign in to your client stewardship dashboard.</p>
        
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="email">Work Email</label>
            <input type="email" class="form-control" id="email" name="email" required placeholder="name@company.com">
          </div>
          
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div style="position: relative;">
              <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••" style="padding-right: 2.5rem;">
              <i class="ph ph-eye password-toggle" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--clr-text-muted);"></i>
            </div>
          </div>

          <div class="form-group" style="display: flex; justify-content: space-between; align-items: center; margin-top: -0.25rem;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <input type="checkbox" id="remember" name="remember" style="margin-top: 0; cursor: pointer;">
              <label class="form-label" for="remember" style="margin-bottom: 0; font-size: 0.85rem; cursor: pointer;">Remember me</label>
            </div>
            <a href="#" style="font-size: 0.85rem; color: var(--clr-secondary); text-decoration: none; font-weight: 500;">Forgot password?</a>
          </div>
          
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
        </form>
        
        <div class="auth-divider">or sign in with</div>
        
        <div style="display: flex; gap: var(--space-2);">
          <button class="auth-btn-social" style="flex: 1; justify-content: center;">
            <i class="ph ph-google-logo" style="color: #DB4437; font-size: 1.3rem;"></i> Google
          </button>
          
          <button class="auth-btn-social" style="flex: 1; justify-content: center;">
            <i class="ph-fill ph-apple-logo" style="font-size: 1.3rem;"></i> Apple
          </button>
        </div>
        
        <p style="margin-top: var(--space-6); font-size: var(--size-label); text-align: center;">
          New client or partner? <a href="register.html" class="auth-link">Register Account</a>
        </p>

        <!-- Compliance Badges -->
        <div style="margin-top: var(--space-6); padding-top: var(--space-4); border-top: 1px solid var(--clr-border); display: flex; justify-content: space-around; font-size: 0.75rem; color: var(--clr-text-muted); text-align: center;">
          <span><i class="ph ph-shield-check"></i> SOC 2 Compliant</span>
          <span><i class="ph ph-seal-check"></i> LEED Verified</span>
          <span><i class="ph ph-leaf"></i> Carbon Neutral Cloud</span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleIcons = document.querySelectorAll('.password-toggle');
      toggleIcons.forEach(icon => {
        icon.addEventListener('click', () => {
          const input = icon.previousElementSibling;
          if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('ph-eye');
            icon.classList.add('ph-eye-slash');
          } else {
            input.type = 'password';
            icon.classList.remove('ph-eye-slash');
            icon.classList.add('ph-eye');
          }
        });
      });
    });
  </script>
</body>
</html>
